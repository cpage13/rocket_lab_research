# =============================================================================
# rklb-comms - DEFAULT scenario (communications model, central case)
# =============================================================================
#
# The central communications scenario. Every value below is set EXPLICITLY and
# equals the schema default, so this file is a faithful, self-documenting
# statement of the central case (loading it equals CommsConfig() field-for-field).
#
# Model: the satellite is costed bottom-up from four areas (antenna, comms
# electronics, solar, radiator/bus). Two satellite classes (broadband, mass-
# bound; direct-to-cell, antenna-stow / volume-bound) fork on satellites-per-
# launch. The constellation acquires one block of spectrum and reuses it across
# beams; capacity comes from an empirical AST anchor, customers from the spectrum
# bridge (a physics/capacity computation, NOT a demand estimate). The cohort
# treadmill vintages each launch year against the service-life cliff. A bottom-up
# ground (cellular) cost is the cost-to-cost denominator; the retail reference is
# the price to beat.
#
# This file computes NO conclusion. It is the input contract: the comparison is
# computed by the engine, and the verdict is written by hand later. There is no
# capture-share dial, no heavier-than-Neutron vehicle, no demand lever of any
# kind, and no baked-in verdict here. Demand is ASSUMED, not modeled: if the
# delivered price undercuts what ground charges and that price is collectable,
# the customers follow.
#
# To run:   uv run rklb-comms scenarios/comms_default.yaml
# To sweep: copy this file, override any block, re-run.
#
# Conventions: money in $M (MUSD) for the cost lines, EXCEPT the solar dial which
# is in USD per kW (called out inline). Year 0 = FY2026 (Neutron's first-flight
# year). Tags: EXISTS (cited in research), INTERIM (an anchored modeling
# assumption), NEEDS-RESEARCH (anchored pending the bill of materials), FOUNDER-
# SET (a founder-chosen reference, not sourced).
# =============================================================================

metadata:
  base_year: 2026               # INTERIM. Model year 0 (Neutron first flight, DC-aligned)
  horizon_years: 10             # INTERIM. FY2036 is the year-10 anchor (90-launch cadence)
  steady_state_year: 2036       # INTERIM. The year the headline mature figure is read at

constellation:
  # Two satellite classes. satellites-per-launch is NOT set here: it is COMPUTED
  # in a later phase from mass and stowed volume against the Neutron envelope
  # (broadband binds on mass, direct-to-cell on volume). A hand-set per-launch
  # count would be the blanket-mass-binds error the design forbids.
  broadband:                    # V3-class, mass-bound (about 5 per launch)
    antenna_cost_musd: 0.45             # NEEDS-RESEARCH. Phased-array aperture, the dominant line
    comms_electronics_cost_musd: 0.35   # NEEDS-RESEARCH. Modems, beam-forming, RF chain
    solar_cost_usd_per_kw: 20000.0      # INTERIM. USD PER KW (not MUSD); about $20k/kW, NOT the DC $40k/kW
    payload_power_kw: 10.0              # NEEDS-RESEARCH. Tens of kW, far below the DC node's ~400 kW
    radiator_bus_cost_musd: 0.20        # INTERIM. Bus plus thermal, anchored light and AI-1-class
    satellite_mass_t: 1.5               # EXISTS (COMM-082). About 1,500 kg; mass binds for broadband
    stowed_volume_m3: 8.0               # INTERIM. Smaller folded volume, so mass binds first
    minor_component_pct: 0.01           # INTERIM. ~1% carry for a minor component not broken out
    # broadband four-area sum: 0.45 + 0.35 + (20000*10/1e6 = 0.20) + 0.20 = 1.20 MUSD
    # (inside the V3 sanity band $0.8M to $1.5M, the about-$1.2M V3 anchor)
  direct_to_cell:               # antenna-stow / volume-bound (about 1 per launch)
    antenna_cost_musd: 2.50             # NEEDS-RESEARCH. Large AST Block 2-class array (~223 m^2) dominates
    comms_electronics_cost_musd: 0.60   # NEEDS-RESEARCH. More beams, more processing than broadband
    solar_cost_usd_per_kw: 20000.0      # INTERIM. USD PER KW; same ~$20k/kW comms anchor
    payload_power_kw: 15.0              # NEEDS-RESEARCH. Higher draw than broadband, still tens of kW
    radiator_bus_cost_musd: 0.40        # INTERIM. Heavier bus than broadband, AI-1-class
    satellite_mass_t: 6.0               # INTERIM. Antenna-heavy; volume binds before mass
    stowed_volume_m3: 70.0              # INTERIM. Folded antenna fills the fairing (80/70 ~= 1 per launch)
    minor_component_pct: 0.01           # INTERIM. ~1% carry
    # direct-to-cell four-area sum: 2.50 + 0.60 + (20000*15/1e6 = 0.30) + 0.40 = 3.80 MUSD
    # (antenna-heavy, strictly greater than broadband, its own anchor)
  satellite_lifetime_years: 5   # INTERIM. The service-life cliff (5 default, test 7, NOT 3)
  v4_capability_multiplier: 1.0 # INTERIM. V4 step from the V1/V2/V3 trend; 1.0 = no step (base case)
  upgraded_neutron: false       # INTERIM. false = baseline Neutron (no bigger-fairing option)
  low_inclination_leo: true     # INTERIM. true = low-inclination LEO (carries more mass than SSO)

launch:
  # Cadence and launch-cost dials reused VERBATIM from the shared common.cadence
  # machinery (same names, bounds, and anchors the DC uses), plus the Neutron
  # mass / fairing-volume envelopes. No heavier-vehicle envelope: Neutron, with
  # an upgraded-Neutron option only.
  cadence_ceiling: 150                  # Hard cap on whole-number launches per year
  launches_at_year_5: 14                # Integer logistic anchor at model year 5
  launches_at_year_10: 90               # Integer logistic anchor at year 10 (90-launches-by-2036)
  first_launch_year: 1                  # Clamps FY2026 to zero; does not shift the anchors
  low_cadence_cost_musd: 25.0           # Launch cost at the low-cadence anchor, $M
  high_cadence_cost_musd: 13.5          # Launch cost at the high-cadence anchor, $M (~$13-13.5M/flight)
  low_cadence_launches: 5.0             # Cadence at the low-cost anchor
  high_cadence_launches: 100.0          # Cadence at the high-cost anchor
  neutron_mass_envelope_t: 13.0         # INTERIM. Baseline Neutron mass to low-inclination LEO, tonnes
  neutron_fairing_volume_m3: 80.0       # EXISTS. Baseline Neutron fairing usable volume, m^3
  upgraded_neutron_mass_envelope_t: 15.0      # INTERIM. Upgraded-Neutron mass envelope, tonnes
  upgraded_neutron_fairing_volume_m3: 100.0   # INTERIM. Upgraded-Neutron fairing volume, m^3

cost_down:
  # The satellite learning curve: a fractional cost reduction per DOUBLING of
  # cumulative units built. The form is pinned; the formula is applied in a later
  # phase. cost multiplier at cumulative N = (N / N0) ** log2(1 - rate).
  learning_rate_per_doubling: 0.10      # INTERIM. 10% reduction per doubling (a 90% learning curve)
  cost_down_reference_units: 1          # INTERIM. N0 anchor: the first unit is the un-discounted cost

spectrum:
  leased_bandwidth_mhz: 40.0            # EXISTS. Per-beam channel width under FCC SCS (the AST 40 MHz anchor)
  spectral_efficiency_bps_per_hz: 0.6   # EXISTS. CROSS-CHECK ONLY, never used to generate capacity
  beams_per_sat: 2500                   # EXISTS. AST Block 2 is designed for ~2,500 adjustable beams
  # The two band dials run low/mid/high and are STORED ASCENDING BY MAGNITUDE.
  # A higher per-user rate provisions a fatter pipe and serves FEWER subscribers,
  # so the customer band is formed by an INVERTED pairing on the rate (rate.high
  # feeds the customer-LOW member). Under these defaults, with the empirical
  # per-beam capacity 120 Mbps and 2,500 beams, the customer band lands EXACTLY:
  #   customer low  = 2500 * (120 / 6.0) * 1.0 =  50,000   (rate.high, oversub.low)
  #   customer mid  = 2500 * (120 / 3.0) * 1.5 = 150,000   (rate.mid,  oversub.mid)
  #   customer high = 2500 * (120 / 2.0) * 2.0 = 300,000   (rate.low,  oversub.high)
  # i.e. the 50,000 / 150,000 / 300,000 registered-subscribers-per-satellite target.
  target_per_user_rate_mbps: { low: 2.0, mid: 3.0, high: 6.0 }   # INTERIM / NEEDS-FOUNDER. Mbps, ascending
  oversubscription_factor: { low: 1.0, mid: 1.5, high: 2.0 }     # INTERIM / NEEDS-FOUNDER. ascending, each >= 1

price_reference:
  # Price / collectability references and geographic scope CONTEXT. NOT demand:
  # demand is assumed, not modeled. There is no top-down-market, growth, take-up,
  # or capture-share dial here.
  retail_reference_usd_per_month: 100.0 # FOUNDER-SET (not sourced). ~$100/month full cell service, the price to beat
  arpu_usd_per_month: 50.0              # EXISTS. Individual-phone ARPU; the revenue-ceiling reconciliation reference
  operator_revenue_share: 0.5           # INTERIM. Fraction of ARPU the space operator collects under an SCS lease
  scope: { us: 0.5, europe: 0.3, asia_ex_china: 0.2 }   # INTERIM. Geographic CONTEXT (ex-China, premium US/EU mix), sums to 1

ground:
  # The bottom-up ground (cellular) cost build, the cost-to-cost denominator
  # (distinct from the retail $100 price to beat above).
  tower_cost_musd_per_site: 0.25            # INTERIM. Amortized tower/site build cost, $M per site
  sites_per_million_subs: 300.0             # INTERIM. Cell sites needed per million subscribers
  backhaul_cost_musd_per_site_year: 0.02    # INTERIM. Annual backhaul/transport per site, $M
  ground_opex_musd_per_site_year: 0.03      # INTERIM. Annual operations and maintenance per site, $M
  ground_amortization_years: 10             # INTERIM. Years over which site capex is amortized
  spectrum_cost_musd: 0.0                   # spectrum nets out of the cost comparison by construction (a wash); explicit zero, not a cost line

scenario_levers:
  scenario_name: "Communications default (central case)"   # equals the schema default (a faithful round-trip)
