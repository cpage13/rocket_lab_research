# =============================================================================
# The Iridium model (formerly Model B): L-band max-outcome, phone-class baseline
# =============================================================================
#
# THE DEFAULT IRIDIUM SCENARIO. Run it from code/ with:
#
#   uv run python -m communications.json_output scenarios/iridium.yaml \
#       communications/models/iridium/default.json
#
# or load it programmatically:
#
#   from communications.config import load_comms_config
#   from communications.engine import run_comms_model
#   trajectory = run_comms_model(load_comms_config("scenarios/iridium.yaml"))
#
# WHAT THIS MODEL IS. The Iridium model is the MSS lane: purpose-built or
# in-chipset devices on Iridium's OWNED L-band. It is NOT cellular direct-to-cell
# to an unmodified phone (that is the High-Bandwidth Cellular Pure Play model,
# formerly Model A, the default no-`iridium` config) and NOT broadband. A single
# top-level `iridium:` block selects the Iridium derivation: the engine DERIVES
# the per-satellite subscriber density from L-band physics (held spectrum, device
# spectral efficiency, aperture area, active rate, busy-hour concurrency) instead
# of reading the fixed `subscribers_per_satellite` dial, then feeds the SAME
# `compute_fleet_target` and fleet machinery (cadence, cohorts, cost, cost-plus
# revenue). Every value below is set EXPLICITLY. All values EXCEPT the two cost
# dials equal the schema default; the launch cost and the satellite build cost
# deliberately DIVERGE from the shared-spine defaults (founder simplification
# 2026-07-09, a flat cost model, see the `launch_cost:` and `satellite:` blocks
# below). This file stays a faithful, self-documenting statement of the
# phone-class baseline.
#
# THE BASELINE NUMBERS this file reproduces (frozen in
# tests/communications/test_iridium_model.py): per-satellite capacity
# 8.0 x 0.65 x 0.15 x (25/25) = 0.78 Gbps; density 780 / (1.0 x 0.025) = 31,200
# subscribers per satellite; fleet target 340 (the coverage floor binds: the
# capacity need at the 10M target is 321); fleet aggregate 265.2 Gbps; beam pool
# 5.2 Mbps; per-user rates 1.0 Mbps peak / 5.0 Mbps off-peak; 12 satellites per
# launch (the launch-coupling identity at the 25 m^2 reference).
#
# THERE IS NO `metadata:` BLOCK ON PURPOSE: `CommsMetadataDials` requires
# `base_year` and `horizon_years` (no field defaults), and omitting the block lets
# the config's default factory supply base year 2026 and horizon 10. The scenario
# label lives in exactly one home, `iridium.scenario_name` (mirroring the
# `GroundInterfaceDials` precedent: an optional block carries its own label).
#
# The fleet dials (cadence, lifetime 5 years, coverage floor 340, saturation cap
# 2,000, subscriber target 10M, revenue multiple 1.5) are the shared config
# defaults, inherited unchanged. The THREE EXCEPTIONS are the manifest share and
# the two cost dials. The share goes all-in: `comms_cadence.share_of_fleet` 1.0
# (pedal to the metal, investor-set 2026-07-14), answering the same all-in
# question the data-center model answers. The cost dials set a deliberately FLAT
# cost model (investor simplification 2026-07-09), a flat launch cost of 13.0 $M
# at every cadence and a satellite build cost of 1.0 $M. All three override ONLY
# this scenario (the config defaults themselves, the 0.18 share, the 25 to
# 13.5 $M launch curve, and the 1.05 $M build cost, are UNTOUCHED, so the
# cellular family and the equality tripwire are unaffected). Operations cost is
# assumed zero: an explicit stated assumption (IRIDIUM_OPERATIONS_COST_MUSD), a
# fixed line to research and add later. The prices-today ARPU revenue case is
# PUBLISHED as the four-bucket case (the `arpu:` block at the end of this file,
# investor-set Sheet A 2026-07-09); cost-plus stays beside it as the
# cost-recovery floor. `spectrum_mhz` is a WIDTH held (8 MHz exclusive), not a
# frequency. This file computes no conclusion: it is the input contract, and the
# engine writes the trajectory.

# =============================================================================
# Pedal to the metal: the all-in manifest share (investor-set 2026-07-14)
# =============================================================================
#
# The deployment posture is the same all-in question the data-center model
# answers: what happens if the Neutron manifest goes to this application?
# share_of_fleet 1.0 overrides the shared-spine 0.18 default for THIS scenario
# only (the config default is untouched, so the cellular family and the
# equality tripwire still see the defaults). The old 18 percent shared-manifest
# posture is retired as the baseline; lower shares are sensitivities, not the
# story. Early-year utilization is deliberately simple: the share applies to
# the whole cadence ramp from year one, with no phase-in. That is an aggressive
# stated assumption, chosen for a simple, consistent framework over phase-in
# precision.
comms_cadence:
  share_of_fleet: 1.0  # investor-set all-in share (pedal to the metal, 2026-07-14)

# =============================================================================
# The FLAT cost model (founder simplification 2026-07-09)
# =============================================================================
#
# A deliberate simplification: no stepped pricing as launches scale. Both cost
# dials are investor-set and in-band of the research anchors, and both OVERRIDE the
# shared-spine config defaults (left untouched, so the cellular family and the
# equality tripwire still see the defaults). Under the all-in share this freezes
# the whole FY2036 build-and-hold at 1,450.0 $M (696 satellite units x 1.0 + 58
# launches x 13.0: the 29-launch build completed in 2031 plus one full five-year
# replacement of the fleet by 2036), a 145.0 $M/yr steady-state annual cost, and
# a 250.0 $M final-year (FY2036) cash replacement, 25.0 $/subscriber against the
# 10M configured base.
#
# The shared launch-cost spine is a log-linear curve from 25.0 $M at 5 launches
# per year down to a 13.5 $M high-cadence floor at 100. Setting BOTH cadence
# anchors equal makes the curve FLAT at 13.0 $M for every cadence (the log-linear
# machinery handles equal endpoints as a zero slope). 13.0 sits just below the
# grounded 13.5 high-cadence floor. The two launches anchors (5 and 100 launches
# per year) stay at their defaults.
launch_cost:
  low_cadence_cost_musd: 13.0   # founder-flat: the low-cadence anchor, set equal to high
  high_cadence_cost_musd: 13.0  # founder-flat: the high-cadence anchor (the curve is flat at 13.0)

# Only the flat hardware build cost is overridden here; the per-launch count (12)
# and the 5-year lifetime stay at their defaults. 1.0 sits just below the prior
# 1.05 dial and the ~1.2 $M Starlink V3 hardware anchor (COMM-080).
satellite:
  satellite_build_cost_musd: 1.0  # founder-flat hardware cost, just below the 1.05 default

iridium:
  # The held L-band WIDTH in MHz (a width, not a frequency; the dial position is
  # ~1.6 GHz): 8.0 is the Iridium EXCLUSIVE holding (~7.775 MHz rounded). The
  # documented variant is 10.5, the full coordinated 1616 to 1626.5 MHz span
  # (contingent on coordination; +31% density: 40,950 subscribers per satellite).
  # Capacity and density scale linearly with this width.
  spectrum_mhz: 8.0

  # The satellite flat phased-array AREA in m^2. 25.0 is the Flatellite flat-body
  # reference, which by design also IS the calibration reference
  # (APERTURE_REFERENCE_M2) and the no-fold stow limit (APERTURE_NO_FOLD_LIMIT_M2,
  # Neutron's 5.5 m fairing). Capacity scales linearly with it (conservative: the
  # per-link SNR lift of a bigger array is ignored); satellites-per-launch couples
  # inversely (60 m^2 flies 5 per launch instead of 12; 400 m^2 flies 1, the AST
  # pattern). Above 25.0 the assumptions output carries the fold caveat: a note,
  # never a validation error, so the what-if stays computable.
  aperture_m2: 25.0

  # The device class that sets the spectral-efficiency (SE) tier, the founder's
  # three device categories (one class per run in v1, no mixed fleet):
  #   phone_class          - 0-dBi in-chipset phone form factor (the ecosystem
  #                          assumption), SE central 0.65 (band 0.5 to 0.8).
  #   small_terminal_class - paperback/puck ~10 dBi purpose-built patch,
  #                          SE central 2.0 (band 1.5 to 2.5).
  #   terminal_class       - large boosted / custom antenna, 15+ dBi (drones,
  #                          fixed sites, vehicles), SE central 2.5 (band 2.0
  #                          to 3.0).
  # An optional `spectral_efficiency_bps_per_hz` override (unset here) beats the
  # class central for in-band sweeps.
  device_class: phone_class

  # The per-subscriber active data rate in Mbps (the service tier, also the peak
  # per-user rate by construction). 1.0 is standard smartphone activity; 2.5 is
  # the rich variant (it shrinks density to 12,480 and flips the fleet to the
  # capacity regime at 802 satellites).
  active_user_rate_mbps: 1.0

  # The busy-hour PEAK concurrency fraction (share of subscribers simultaneously
  # active at peak): 0.025 (2.5%, the center of the corpus ~1-5% D2C band). Sets
  # the offered load per subscriber and hence the density.
  concurrency_peak: 0.025

  # The OFF-PEAK concurrency fraction: 0.005 (0.5%, founder-set pair value). Sets
  # the off-peak per-user rate (capped by the single-beam pool, 5.2 Mbps here).
  concurrency_offpeak: 0.005

  # A separate DEVICE passthrough counter (not people, not folded into the
  # subscriber count, zero fleet-sizing effect): 10,000,000 (low end of tens of
  # millions). Contention, not population, is the real IoT constraint.
  iot_devices: 10000000

  # The Iridium-model scenario label's single home.
  scenario_name: "Iridium L-band max-outcome (phone-class baseline)"

  # ===========================================================================
  # The four-bucket ARPU revenue case (Sheet A, founder-set 2026-07-09)
  # ===========================================================================
  #
  # The PUBLISHED Iridium revenue case: four billable-connection buckets (standard
  # personal / premium terminal / IoT devices / government), each a PERCENTAGE mix
  # of ONE pool anchored to fleet CAPACITY (fleet_target x subscribers_per_satellite
  # = 340 x 31,200 = 10,608,000 people at the baseline), so every bucket scales with
  # the satellite count (mechanically, the 2,000-satellite saturation cap reads about
  # 5.882x this). The four mixes and four monthly prices are the founder-set dials;
  # the counts are DERIVED (engine.derive_arpu_buckets, standard the residual so the
  # people identity is exact). Subscribers are PEOPLE (standard, premium); IoT are
  # DEVICES; government is a contract line: the pool is a billable-connections
  # accounting frame (Iridium's own convention folds IoT devices into "billable
  # subscribers", COMM-617), NOT one summed people population.
  #
  # The PREMIUM bucket is a PRICE TIER, not a population claim about specific
  # platforms: the 1,248,000 premium connections are simply the higher-price
  # service tier. Example applications (ships, aircraft, premium IoT, government
  # uses, remote enterprise) are purely ILLUSTRATIVE, never a claim about which
  # platforms hold the 1.25M units (the world merchant fleet, for one, is far
  # smaller).
  #
  # SHEET A (this block, the blessed default) at 340 satellites, all exact:
  #   people share = standard + premium = 17.0 percent
  #   pool         = 10,608,000 / 0.17 = 62,400,000 connections
  #   standard     = 9,360,000 people    at $15  = $1,684.8M per year
  #   premium      = 1,248,000 people    at $100 = $1,497.6M per year
  #   IoT          = 51,670,320 devices  at $8   = $4,960.35072M per year
  #   government   = 121,680 contracts   at $74  = $108.05184M per year
  #   total                                       = $8,250.80256M per year
  # The government mix 0.195 is calibrated so the baseline government line reproduces
  # today's fixed EMSS book (about $108M over ~121.7k connections, COMM-619).
  #
  # SHEET B (the documented alternative, NOT the default): standard 18.7, premium
  # 2.5, IoT 78.55, government 0.25 (sum 100.00), the today's-device-ratio posture
  # (about 3.7 devices per person, COMM-617/618): about 39.3M devices, about $3.77B
  # per year from IoT, people counts nearly unchanged, total about $7.07B per year.
  # To use Sheet B, replace the four mixes below with those values.
  #
  # RULES: the four mixes MUST sum to 100 (the config validator, within a tiny
  # epsilon). Both people mixes (standard, premium) must be strictly positive so the
  # people share is never zero. Prices are dollars per connection per month.
  arpu:
    standard_mix_pct: 15.0            # standard personal (phone-class) people share
    premium_mix_pct: 2.0              # premium terminal (gain-antenna) people share
    iot_mix_pct: 82.805              # IoT devices: the residual that closes the mix to 100
    government_mix_pct: 0.195         # government: de-anchored to reproduce today's EMSS book
    standard_price_usd_month: 15.0    # midpoint of the founder's $10 to $20 range
    premium_price_usd_month: 100.0    # between Iridium voice/data $47 and Certus $259
    iot_price_usd_month: 8.0          # about the $7.78 Iridium IoT ARPU today
    government_price_usd_month: 74.0  # today's per-connection EMSS equivalent
