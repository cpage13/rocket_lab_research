# =============================================================================
# The Iridium model (formerly Model B): L-band max-outcome, every device class
# =============================================================================
#
# THE DEFAULT IRIDIUM SCENARIO. Run it from code/ with:
#
#   uv run python -m communications.json_output scenarios/iridium.yaml \
#       communications/models/iridium/default.json
#
# or load it programmatically:
#
#   from pathlib import Path
#   from communications.config import load_comms_config
#   from communications.iridium import run_iridium_model
#   from communications.saturation_curve import load_saturation_curve
#   config = load_comms_config("scenarios/iridium.yaml")
#   # the curve path is repository-relative, and the repository root is .. from code/
#   curve = load_saturation_curve(Path("..") / config.iridium.saturation.curve_path)
#   run = run_iridium_model(config, curve)
#
# WHAT THIS MODEL IS. The Iridium model is the MSS lane: purpose-built or
# in-chipset devices on Iridium's OWNED L-band. It is NOT cellular direct-to-cell
# to an unmodified phone (that is the High-Bandwidth Cellular Pure Play model,
# formerly Model A, the default no-`iridium` config) and NOT broadband. A single
# top-level `iridium:` block selects the Iridium model. Its fleet is every comms
# launch the Neutron cadence share allows, times the satellites per launch, over a
# five-year life: no fleet target and no cap. Each device class (the small
# terminal, the mounted terminal, the phone class) reads its people from the
# promoted saturation curve (the useful co-channel beams over places people live,
# computed once at the 25 m^2 reference panel and the held 8 MHz), times the
# downlink share and the panel factor, and every seat its living fleet carries is
# sold at the class's flat price, side by side in one run. The two IoT lines are
# fixed books of their own. Each class's saturation number, its spectrum bound, is
# reported beside the cadence, never a cap on the build. Every class's people,
# revenue and own margin, the readings and the IoT check are in the promoted
# artifact; this file computes no conclusion.
#
# THE SETTINGS. The all-in share and the flat cost model below differ from the
# shared-spine defaults (the config defaults themselves, the 0.18 share, the 25 to
# 13.5 $M launch curve and the 1.05 $M build cost, are untouched, so the cellular
# family and the equality tripwire still see them); satellites per launch is 16
# with the Neutron block upgrade assumed; the Iridium block sets the held spectrum,
# the 15.4 m^2 panel, the label, the saturation block and the five prices. Each
# class's usage and spectral efficiency and the two IoT lines' device counts are
# named constants (ADR 007), not settings. On an Iridium config the cellular
# family's sizing and revenue dials (the coverage, subscribers and revenue blocks)
# keep their defaults, the coverage floor pinned at 340 satellites (nothing is sold
# in a year whose living fleet is below it), and a ground block is refused: the
# config rejects another value at load, naming it. Operations cost is assumed zero:
# an explicit stated assumption (IRIDIUM_OPERATIONS_COST_MUSD), a fixed line to
# research and add later. `spectrum_mhz` is a WIDTH held (8 MHz exclusive), not a
# frequency.
#
# THERE IS NO `metadata:` BLOCK ON PURPOSE: `CommsMetadataDials` requires
# `base_year` and `horizon_years` (no field defaults), and omitting the block lets
# the config's default factory supply base year 2026 and horizon 10. The scenario
# label lives in exactly one home, `iridium.scenario_name` (mirroring the
# `GroundInterfaceDials` precedent: an optional block carries its own label).

# =============================================================================
# Pedal to the metal: the all-in manifest share (investor-set 2026-07-14)
# =============================================================================
#
# The deployment posture is the same all-in question the data-center model
# answers: what happens if the Neutron manifest goes to this application?
# share_of_fleet 1.0 overrides the shared-spine 0.18 default for THIS scenario
# only (the config default is untouched, so the cellular family and the
# equality tripwire still see the defaults). The old 18 percent shared-manifest
# posture is retired as the baseline; lower shares are sensitivities, not the
# story. Early-year utilization is deliberately simple: the share applies to
# the whole cadence ramp from year one, with no phase-in. That is an aggressive
# stated assumption, chosen for a simple, consistent framework over phase-in
# precision.
comms_cadence:
  share_of_fleet: 1.0  # investor-set all-in share (pedal to the metal, 2026-07-14)

# =============================================================================
# The FLAT cost model (investor simplification 2026-07-09)
# =============================================================================
#
# A deliberate simplification: no stepped pricing as launches scale. Both cost
# dials are investor-set and in-band of the research anchors, and both OVERRIDE the
# shared-spine config defaults (left untouched, so the cellular family and the
# equality tripwire still see the defaults). With 16 satellites per launch a
# satellite costs (1.0 + 13.0 / 16) / 5 = 0.3625 $M a year over its five-year life.
#
# The shared launch-cost spine is a log-linear curve from 25.0 $M at 5 launches
# per year down to a 13.5 $M high-cadence floor at 100. Setting BOTH cadence
# anchors equal makes the curve FLAT at 13.0 $M for every cadence (the log-linear
# machinery handles equal endpoints as a zero slope). 13.0 sits just below the
# grounded 13.5 high-cadence floor. The two launches anchors (5 and 100 launches
# per year) stay at their defaults.
launch_cost:
  low_cadence_cost_musd: 13.0   # investor-flat: the low-cadence anchor, set equal to high
  high_cadence_cost_musd: 13.0  # investor-flat: the high-cadence anchor (the curve is flat at 13.0)

# Satellites per launch and the flat hardware build cost are set here; the
# five-year lifetime stays at its default. 1.0 sits just below the prior 1.05 dial
# and the ~1.2 $M Starlink V3 hardware anchor (COMM-080).
satellite:
  satellites_per_launch: 16   # the validated Flatellite stack with the Neutron block upgrade assumed from the first launch (a stated assumption; 15 without it): the stack in the fairing's cylinder at calculation C's pitch, on a rod-held base (COMM-713; COMM-712)
  satellite_build_cost_musd: 1.0  # investor-flat hardware cost, just below the 1.05 default

iridium:
  spectrum_mhz: 8.0           # the EXCLUSIVE holding (a width, ~7.775 MHz rounded); each class's usage is a named constant (the investor's, 2026-10-04), not a setting
  aperture_m2: 15.4           # the validated Flatellite panel, an upper bound (COMM-711); the curve is computed at 25 m^2 and scaled linearly (x 0.616)
  scenario_name: "Iridium L-band max-outcome (every device class)"

  # The saturation block (ADRs 005 and 008): the TDD downlink time share d, and the path of
  # the promoted saturation curve (repository-relative; an absolute path is allowed), which
  # `python -m communications.saturation` computes with the band in full-time use (d = 1).
  # 0.67 is Certus 700's 2 : 1 down-to-up rate split (COMM-620).
  saturation:
    downlink_share: 0.67   # TDD downlink time share (ADR 008); 0.5 is the symmetric frame, 0.75 an estimated alternative
    curve_path: communications/models/iridium/saturation_curve.json   # the promoted curve, repo-relative

  # The five monthly prices, dollars, held flat (the investor, 2026-10-03; the IoT
  # split 2026-10-04; the two terminal prices moved to $10 and $50 on 2026-10-07).
  # A lower price or a smaller market is a division in the conclusions, never a
  # setting. Government is left out of revenue.
  arpu:
    small_terminal_class_price_usd_month: 10.0     # the investor's $10 (2026-10-07), held flat; it was $15, the midpoint of the $10 to $20 range
    mounted_terminal_class_price_usd_month: 50.0   # the investor's $50 (2026-10-07), held flat; it was $100; near Iridium voice and data $47, under Certus $259
    phone_class_price_usd_month: 15.0              # its floor (the investor, 2026-10-03); a fallback that needs the chip, never primary
    minimal_packet_iot_price_usd_month: 4.0        # 48 messages of 340 bytes a day; the IoT counts are named constants (ADR 007), not settings
    data_iot_price_usd_month: 8.0                  # about 88 kbps, 4 bursts of 100 KB a day plus the messages; its count 25,835,160, half the minimal-packet count at double its price (a named constant)
