# =============================================================================
# rklb-value: VOLUME_STRESS scenario (V15 test fixture)
# =============================================================================
#
# What it tests: that validation rule V15 (volume_fits_horizon) fails when the
# stowed node does not fit the Neutron fairing. THIS IS A DELIBERATELY
# ARTIFICIAL SCENARIO: it is never used for projections, sensitivity sweeps,
# or any headline number. Quote nothing from it.
#
# How it trips V15. V15 reads every year's physical.volume_utilization_pct
# directly and fails on any year above 100 percent (the stowed node overfills
# the usable fairing volume). The stowed node volume is the deployed
# solar-array area times the stowed panel pitch (a stowed array is a stack of
# panels), times one plus the mounting overhead, plus the fixed bus volume
# (gospel.node_volume_fixed_m3, 5 m3). The bus volume alone fills a 5 m3
# fairing, so the one artificial dial,
#     volume.neutron_fairing_usable_volume_m3: 5.0   (vs 80.0 in default.yaml),
# overfills the fairing in every year (about 270 to 340 percent). Each year is
# labeled "both" (the mass envelope binds, as floor packing makes it every
# year, and the fairing is full) and V15 FAILS. That failure is the designed
# behaviour this fixture demonstrates; it is not a model regression.
#
# Every other value is an ordinary dial: the 12.5 t default mass envelope
# and the co-mounted conservative posture (single_face_co_mounted,
# 0.013/0.012 t/kW radiator, 0.04 $M/kW solar and radiator cost). None of it
# is needed to trip V15.
#
# To run:   uv run rklb-value scenarios/volume_stress.yaml
# =============================================================================

scenario_name: "Volume stress (V15-trigger test fixture)"

metadata:
  workload_type: inference                       # D14 (investor-locked)
  operator_model: b2b_dedicated_optical_rf       # D15 (investor-locked)
  radiator_architecture: single_face_co_mounted  # the labeled conservative exception (the D16 lock, superseded 2026-07-14)
  deployment_philosophy: ground_validated_before_launch
  base_year: 2026
  horizon_years: 10

cadence:
  # Logistic launch ramp: integer mission counts from SOURCE_INDEX NTR-010.
  cadence_ceiling: 150
  launches_at_year_5: 14
  launches_at_year_10: 90
  first_launch_year: 1

fleet:
  service_life_years: 5            # node operating life, hard cliff (D1)

volume:
  # Stowed solar+radiator volume-envelope dials: R1-sourced, except
  # neutron_fairing_usable_volume_m3, ARTIFICIALLY cut from 80.0 to 5.0 as the
  # V15 trigger (see the file header), NOT a real dial value.
  si_bol_efficiency: 0.20
  stowed_pitch_mm: 6.0
  mounting_overhead_pct: 0.30
  neutron_fairing_usable_volume_m3: 5.0   # <-- ARTIFICIAL: V15 trigger (see header)

r_band:
  # The three R trajectories: scenario assumptions tied to SOURCE_INDEX REV-008.
  central:
    - { fy: 2026, r: 1.50 }
    - { fy: 2028, r: 1.48 }
    - { fy: 2030, r: 1.46 }
    - { fy: 2032, r: 1.44 }
    - { fy: 2034, r: 1.42 }
    - { fy: 2036, r: 1.40 }
  low:
    - { fy: 2026, r: 1.20 }
    - { fy: 2028, r: 1.20 }
    - { fy: 2030, r: 1.15 }
    - { fy: 2032, r: 1.15 }
    - { fy: 2034, r: 1.15 }
    - { fy: 2036, r: 1.15 }
  high:
    - { fy: 2026, r: 1.80 }
    - { fy: 2028, r: 1.80 }
    - { fy: 2030, r: 1.75 }
    - { fy: 2032, r: 1.70 }
    - { fy: 2034, r: 1.65 }
    - { fy: 2036, r: 1.65 }

launch_cost:
  # Cadence-indexed launch cost (log-linear curve): v7-archaeology dials.
  low_cadence_cost_musd: 25.0
  high_cadence_cost_musd: 13.5
  low_cadence_launches: 5.0
  high_cadence_launches: 100.0

gospel:
  # The co-mounted conservative posture: cycle-1 gospel verbatim except the
  # radiator dial 0.007 -> 0.012 (D17) and the node_volume_fixed_m3 bus
  # volume. The mass envelope is the default 12.5 t block-upgrade SSO scenario
  # (SOURCE_INDEX NTR-007), not a V15 lever.
  mass_envelope_t: 12.5
  node_mass_fixed_t: 2.5
  node_volume_fixed_m3: 5.0
  tjmax_lift_year: 5
  radiator_t_per_kw_pre: 0.013
  radiator_t_per_kw_post: 0.012   # <-- changed from cycle-1 0.007 (D17)
  solar_mass_t_per_kw: 0.011
  bus_base_musd: 8.0
  bus_flatten_after_yr: 5
  bus_growth_pre: -0.03
  solar_cost_musd_per_kw: 0.04
  radiator_cost_musd_per_kw: 0.04
  release_cadence_yr: 1.5         # GENERATION cadence (18 months, D6)

slopes:
  # Post-Feynman per-generation growth slopes (every ~18 months).
  usd_growth_per_gen: 0.30
  # 0.20: per-package power growth/gen; corrected from 0.30
  # (assembly-rate misapplied) per validation V-A, sourcing_audit_05_21.md.
  kw_growth_per_gen: 0.20
  kg_growth_per_gen: -0.10        # mass falls per gen (denser packaging)
  pf_growth_per_gen: 0.625        # implied PF/kW slope ~25%/gen (D12)

# `generations:` omitted = use the bundled KNOWN_GENS (5 sourced gens:
# B200/GB200, B300/GB300, Rubin VR200, Rubin Ultra, Feynman).
