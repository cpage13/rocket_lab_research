[project]
name = "rklb-value"
version = "0.1.0"
description = "YAML-driven valuation calculator for Rocket Lab's orbital AI-inference data-center venture (standalone)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.2",
    "pydantic>=2.9",
]

[project.scripts]
rklb-value = "data_center.cli:main"
rklb-comms = "communications.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_center", "src/communications", "src/common"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.mypy]
python_version = "3.14"
exclude = ["^tests/"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
no_implicit_reexport = true
strict_equality = true

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ANN", "S", "C4", "SIM", "PT"]
ignore = ["ANN401"]  # Allow Any in narrow places with comment

[tool.ruff.lint.per-file-ignores]
# Test files: standard pytest patterns conflict with strict rules.
# S101 (assert) is the pytest idiom; ANN does not require strict typing in tests;
# B905, PT017, PT018 are stylistic and not load-bearing in test code.
"tests/**/*.py" = ["S101", "ANN", "B905", "PT017", "PT018", "SIM201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# importlib import mode lets the data-center and communications test packages
# carry same-basename modules (test_validation.py, test_cli_promote.py,
# test_text_report.py exist in both) without an __init__.py in either test
# directory. The default "prepend" mode would collide on the shared basenames.
addopts = "-ra --strict-markers --import-mode=importlib"
